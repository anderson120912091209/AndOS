<!doctype html>
<html><head><meta charset="utf-8"><title>Relay</title>

      <path class="happy" d="M32 56 Q37 49 42 56 M58 56 Q63 49 68 56" />
      <path class="smile" d="M45 66 Q50 71 55 66" />
      <circle class="oh" cx="50" cy="67" r="3" />

    <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="dots"><i></i><i></i><i></i></div>
    <svg class="check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" /></svg>
    <span class="text"></span>
  </div>
  <script src="hud.js"></script>
</body></html>
